<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>DVD Screensaver</title>
<script src="https://code.jquery.com/jquery-3.5.1.min.js"
        integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
    <style>
        :root {
            background: #000;
            color-scheme: dark;
        }

        html,
        body {
            background: #000;
            color: #fff;
            height: 100%;
            height: 100dvh; /* Telefoon: past zich aan als de adresbalk verdwijnt */
            margin: 0;
            min-height: 100%;
            overflow: hidden;
            position: relative;
            touch-action: manipulation; /* Geen zoom door dubbel tikken */
        }

        /* Onzichtbare rechthoekige omtrek van het logo (geen kader, geen padding) */
        .marquee {
            display: block;
            left: 0;
            position: absolute;
            top: 0;
        }

        svg {
            display: block;
        }

        .logo {
            fill: #fff;
        }

        /* Klein, doorzichtig fullscreen-knopje rechtsonder (verdwijnt na een paar seconden, tik op het scherm om het terug te halen) */
        #fullscreen-knop {
            background: none;
            border: 0;
            bottom: 12px;
            cursor: pointer;
            height: 44px;
            opacity: 0.6;
            padding: 10px;
            position: fixed;
            right: 12px;
            transition: opacity 0.4s;
            width: 44px;
            z-index: 10;
            -webkit-tap-highlight-color: transparent;
        }

        #fullscreen-knop.verborgen {
            opacity: 0;
            pointer-events: none;
        }

        #fullscreen-knop svg {
            fill: none;
            height: 24px;
            stroke: #fff;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 2.5;
            width: 24px;
        }
    </style>




    <!-- Fullscreen-knop -->
    <button id="fullscreen-knop" aria-label="Volledig scherm">
        <svg viewBox="0 0 24 24">
            <path id="knop-icoon" d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6" />
        </svg>
    </button>

    <!-- Het DVD logo (wordt gekopieerd op basis van het aantal dat je instelt) -->
    <template id="logo-template">
        <div class="marquee">
            <svg viewBox="0 0 153 69">
                <g>
                    <path class="logo"
                        d="M140.186,63.52h-1.695l-0.692,5.236h-0.847l0.77-5.236h-1.693l0.076-0.694h4.158L140.186,63.52L140.186,63.52z M146.346,68.756h-0.848v-4.545l0,0l-2.389,4.545l-1-4.545l0,0l-1.462,4.545h-0.771l1.924-5.931h0.695l0.924,4.006l2.078-4.006 h0.848V68.756L146.346,68.756z M126.027,0.063H95.352c0,0-8.129,9.592-9.654,11.434c-8.064,9.715-9.523,12.32-9.779,13.02 c0.063-0.699-0.256-3.304-3.686-13.148C71.282,8.7,68.359,0.062,68.359,0.062H57.881V0L32.35,0.063H13.169l-1.97,8.131 l14.543,0.062h3.365c9.336,0,15.055,3.747,13.467,10.354c-1.717,7.24-9.91,10.416-18.545,10.416h-3.24l4.191-17.783H10.502 L4.34,37.219h20.578c15.432,0,30.168-8.13,32.709-18.608c0.508-1.906,0.443-6.67-0.764-9.527c0-0.127-0.063-0.191-0.127-0.444 c-0.064-0.063-0.127-0.509,0.127-0.571c0.128-0.062,0.383,0.189,0.445,0.254c0.127,0.317,0.19,0.57,0.19,0.57l13.083,36.965 l33.344-37.6h14.1h3.365c9.337,0,15.055,3.747,13.528,10.354c-1.778,7.24-9.972,10.416-18.608,10.416h-3.238l4.191-17.783h-14.481 l-6.159,25.976h20.576c15.434,0,30.232-8.13,32.709-18.608C152.449,8.193,141.523,0.063,126.027,0.063L126.027,0.063z M71.091,45.981c-39.123,0-70.816,4.512-70.816,10.035c0,5.59,31.693,10.034,70.816,10.034c39.121,0,70.877-4.444,70.877-10.034 C141.968,50.493,110.212,45.981,71.091,45.981L71.091,45.981z M68.55,59.573c-8.956,0-16.196-1.523-16.196-3.365 c0-1.84,7.239-3.303,16.196-3.303c8.955,0,16.195,1.463,16.195,3.303C84.745,58.05,77.505,59.573,68.55,59.573L68.55,59.573z" />
                </g>
            </svg>
        </div>
    </template>

    <script>
        // =====================================================
        // INSTELLINGEN - hier pas je zelf dingen aan
        // =====================================================

        // Hoeveelheid dvd logos
        const AANTAL_LOGOS = 1;

        // Snelheid van de logos (in pixels per seconde)
        const SNELHEID = 180;

        // Grootte van het logo (breedte in pixels, de hoogte schaalt automatisch mee)
        const GROOTTE = 100;

        // =====================================================
        // EINDE INSTELLINGEN
        // =====================================================


        $(document).ready(function () {
            var template = document.getElementById('logo-template');
            var logos = [];

            // Afmetingen van het scherm
            function schermBreedte() { return window.innerWidth; }
            function schermHoogte() { return window.innerHeight; }

            // Controleert of twee logos (hun onzichtbare rechthoek) elkaar raken
            function raken(a, b) {
                return a.x < b.x + b.w && a.x + a.w > b.x &&
                    a.y < b.y + b.h && a.y + a.h > b.y;
            }

            // Nieuwe kleur van het logo bij een botsing met de rand
            function nieuweKleur(logo) {
                var newColor = "hsl(" + Math.floor(Math.random() * 360) + ", 100%, 50%)";
                logo.el.find('.logo').css('fill', newColor);
            }

            // Maak het ingestelde aantal logos aan
            for (var i = 0; i < AANTAL_LOGOS; i++) {
                var $el = $(template.content.cloneNode(true)).children().first();
                $el.find('svg').attr('width', GROOTTE + 'px');
                $('body').append($el);

                var logo = {
                    el: $el,
                    w: $el.outerWidth(),
                    h: $el.outerHeight(),
                    x: 0,
                    y: 0,
                    // Willekeurige startrichting
                    vx: (Math.random() < 0.5 ? -1 : 1) * SNELHEID,
                    vy: (Math.random() < 0.5 ? -1 : 1) * SNELHEID
                };

                // Willekeurige startpositie, zonder dat een logo op een ander logo begint
                for (var poging = 0; poging < 200; poging++) {
                    logo.x = Math.random() * Math.max(0, schermBreedte() - logo.w);
                    logo.y = Math.random() * Math.max(0, schermHoogte() - logo.h);
                    var vrij = true;
                    for (var j = 0; j < logos.length; j++) {
                        if (raken(logo, logos[j])) { vrij = false; break; }
                    }
                    if (vrij) { break; }
                }

                logos.push(logo);
            }

            // Beweging van de logos (elk beeld opnieuw)
            var laatsteTijd = null;
            function beweeg(nu) {
                if (laatsteTijd === null) { laatsteTijd = nu; }
                // Maximaal 0.05 seconde per stap, zodat logos niet door elkaar springen na een pauze
                var dt = Math.min((nu - laatsteTijd) / 1000, 0.05);
                laatsteTijd = nu;

                var W = schermBreedte();
                var H = schermHoogte();

                // Verplaatsen en stuiteren tegen de randen van het scherm
                logos.forEach(function (l) {
                    l.x += l.vx * dt;
                    l.y += l.vy * dt;

                    if (l.x < 0) {
                        l.x = 0; l.vx = Math.abs(l.vx); nieuweKleur(l);
                    } else if (l.x > W - l.w) {
                        l.x = W - l.w; l.vx = -Math.abs(l.vx); nieuweKleur(l);
                    }
                    if (l.y < 0) {
                        l.y = 0; l.vy = Math.abs(l.vy); nieuweKleur(l);
                    } else if (l.y > H - l.h) {
                        l.y = H - l.h; l.vy = -Math.abs(l.vy); nieuweKleur(l);
                    }
                });

                // Stuiteren van de logos tegen elkaar
                for (var i = 0; i < logos.length; i++) {
                    for (var j = i + 1; j < logos.length; j++) {
                        var a = logos[i], b = logos[j];
                        if (!raken(a, b)) { continue; }

                        var overlapX = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
                        var overlapY = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);

                        if (overlapX < overlapY) {
                            // Botsing van links/rechts
                            var links = a.x < b.x ? a : b;
                            var rechts = a.x < b.x ? b : a;
                            links.x -= overlapX / 2;
                            rechts.x += overlapX / 2;
                            links.vx = -Math.abs(links.vx);
                            rechts.vx = Math.abs(rechts.vx);
                        } else {
                            // Botsing van boven/onder
                            var boven = a.y < b.y ? a : b;
                            var onder = a.y < b.y ? b : a;
                            boven.y -= overlapY / 2;
                            onder.y += overlapY / 2;
                            boven.vy = -Math.abs(boven.vy);
                            onder.vy = Math.abs(onder.vy);
                        }
                    }
                }

                // Logos op hun nieuwe plek zetten
                logos.forEach(function (l) {
                    l.el.css('transform', 'translate(' + l.x + 'px, ' + l.y + 'px)');
                });

                requestAnimationFrame(beweeg);
            }

            requestAnimationFrame(beweeg);

            // Fullscreen aan/uit met de f-toets
            $(document).on('keydown', function (e) {
                if (e.key === 'f' || e.key === 'F') {
                    if (document.fullscreenElement) {
                        document.exitFullscreen();
                    } else {
                        document.documentElement.requestFullscreen();
                    }
                }
            });

            // Fullscreen-knop (zoals bij YouTube)
            var root = document.documentElement;
            var knop = document.getElementById('fullscreen-knop');
            var icoon = document.getElementById('knop-icoon');
            var kanFullscreen = root.requestFullscreen || root.webkitRequestFullscreen;
            var verbergTimer = null;

            // Icoon: vier hoeken naar buiten (aan) of naar binnen (uit)
            var ICOON_AAN = 'M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6';
            var ICOON_UIT = 'M9 3v6H3M21 9h-6V3M15 21v-6h6M3 15h6v6';

            function isFullscreen() {
                return document.fullscreenElement || document.webkitFullscreenElement;
            }

            function toonKnop() {
                knop.classList.remove('verborgen');
                clearTimeout(verbergTimer);
                // Na 3 seconden weer onzichtbaar
                verbergTimer = setTimeout(function () {
                    knop.classList.add('verborgen');
                }, 3000);
            }

            if (!kanFullscreen) {
                // Deze browser kan geen fullscreen (bijvoorbeeld Safari op iPhone): geen knop tonen
                knop.style.display = 'none';
            } else {
                knop.addEventListener('click', function () {
                    try {
                        var resultaat;
                        if (isFullscreen()) {
                            resultaat = (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                        } else {
                            resultaat = (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
                        }
                        if (resultaat && resultaat.catch) { resultaat.catch(function () { }); }
                    } catch (fout) { }
                    toonKnop();
                });

                function wisselIcoon() {
                    icoon.setAttribute('d', isFullscreen() ? ICOON_UIT : ICOON_AAN);
                }
                document.addEventListener('fullscreenchange', wisselIcoon);
                document.addEventListener('webkitfullscreenchange', wisselIcoon);

                // Een tik op het scherm haalt de knop even terug
                document.addEventListener('pointerdown', toonKnop);
                toonKnop();
            }
        });
    </script>




</body></html>
